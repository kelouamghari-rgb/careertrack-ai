{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3">Edit Application</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" name="company" class="form-control" value="{{ app.company }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role Title</label>
                    <input type="text" name="role" class="form-control" value="{{ app.role }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Saved" {% if app.status == 'Saved' %}selected{% endif %}>Saved</option>
                        <option value="Applied" {% if app.status == 'Applied' %}selected{% endif %}>Applied</option>
                        <option value="Interviewing" {% if app.status == 'Interviewing' %}selected{% endif %}>Interviewing</option>
                        <option value="Offer" {% if app.status == 'Offer' %}selected{% endif %}>Offer</option>
                        <option value="Rejected" {% if app.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update Application</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
